# Telegram нічого не знає про токени Supabase і шле на webhook звичайний
# POST. Зі звичайною перевіркою JWT шлюз відкидав би кожен його запит, і
# бот мовчав би, не лишаючи в логах нічого зрозумілого.
#
# Замість JWT функцію захищає TG_WEBHOOK_SECRET: Telegram додає його
# заголовком X-Telegram-Bot-Api-Secret-Token, а функція звіряє на кожному
# запиті й без нього відповідає 403, навіть не читаючи тіла.
[functions.telegram-bot]
verify_jwt = false
