# Telegram нічого не знає про токени Supabase і шле на webhook звичайний
# POST. Зі звичайною перевіркою JWT шлюз відкидав би кожен його запит, і
# бот мовчав би, не лишаючи в логах нічого зрозумілого.
#
# Замість JWT функцію захищає TG_WEBHOOK_SECRET: Telegram додає його
# заголовком X-Telegram-Bot-Api-Secret-Token, а функція звіряє на кожному
# запиті й без нього відповідає 403, навіть не читаючи тіла.
[functions.telegram-bot]
verify_jwt = false

# Імпорт з Facebook викликають двоє, і жоден із них не проходить
# звичайну перевірку JWT шлюзом:
#
#   pg_cron щогодини — о будь-якій годині ніхто не залогінений, токена
#     взяти нізвідки. Замість нього спільний секрет у заголовку
#     x-cron-key, який функція звіряє сама;
#
#   кнопка «Sync now» у дашборді — браузер спершу шле preflight OPTIONS,
#     і він іде БЕЗ Authorization завжди, за стандартом. Зі ввімкненою
#     перевіркою шлюз відкидає саме його, і в консолі це виглядає як
#     голе «Failed to fetch», без жодної підказки чому.
#
# Функція від цього не стає відкритою. Без заголовків вона відповідає
# 401, а на браузерному вході сама питає Supabase Auth, хто прийшов, і
# синхронізує ТІЛЬКИ токени цієї людини — межі ставить перевірений uid,
# а не те, що попросили в тілі запиту.
[functions.fb-sync]
verify_jwt = false

# Єдине місце в проєкті, яке щось МІНЯЄ у Facebook. Перевірку JWT
# шлюзом тут вимкнено з тієї ж причини, що й у fb-sync: браузер перед
# POST шле preflight OPTIONS, а той за стандартом іде без Authorization
# завжди, і шлюз відкидав би саме його.
#
# Входу за спільним секретом тут НЕМАЄ і бути не повинно: дія, яка
# зупиняє рекламу, не мусить бути досяжною з розкладу навіть теоретично.
# Єдиний спосіб покликати — прийти з токеном людини, і функція сама
# питає Supabase Auth, хто це, а потім перевіряє, що кабінет належить
# саме їй.
[functions.fb-pause]
verify_jwt = false
