# Telegram нічого не знає про токени Supabase і шле на webhook звичайний
# POST. Зі звичайною перевіркою JWT шлюз відкидав би кожен його запит, і
# бот мовчав би, не лишаючи в логах нічого зрозумілого.
#
# Замість JWT функцію захищає TG_WEBHOOK_SECRET: Telegram додає його
# заголовком X-Telegram-Bot-Api-Secret-Token, а функція звіряє на кожному
# запиті й без нього відповідає 403, навіть не читаючи тіла.
[functions.telegram-bot]
verify_jwt = false

# Імпорт з Facebook викликають двоє, і жоден із них не проходить
# звичайну перевірку JWT шлюзом:
#
#   pg_cron щогодини — о будь-якій годині ніхто не залогінений, токена
#     взяти нізвідки. Замість нього спільний секрет у заголовку
#     x-cron-key, який функція звіряє сама;
#
#   кнопка «Sync now» у дашборді — браузер спершу шле preflight OPTIONS,
#     і він іде БЕЗ Authorization завжди, за стандартом. Зі ввімкненою
#     перевіркою шлюз відкидає саме його, і в консолі це виглядає як
#     голе «Failed to fetch», без жодної підказки чому.
#
# Функція від цього не стає відкритою. Без заголовків вона відповідає
# 401, а на браузерному вході сама питає Supabase Auth, хто прийшов, і
# синхронізує ТІЛЬКИ токени цієї людини — межі ставить перевірений uid,
# а не те, що попросили в тілі запиту.
[functions.fb-sync]
verify_jwt = false

# Єдине місце в проєкті, яке щось МІНЯЄ у Facebook. Перевірку JWT
# шлюзом тут вимкнено з тієї ж причини, що й у fb-sync: браузер перед
# POST шле preflight OPTIONS, а той за стандартом іде без Authorization
# завжди, і шлюз відкидав би саме його.
#
# Входу за спільним секретом тут НЕМАЄ і бути не повинно: дія, яка
# зупиняє рекламу, не мусить бути досяжною з розкладу навіть теоретично.
# Єдиний спосіб покликати — прийти з токеном людини, і функція сама
# питає Supabase Auth, хто це, а потім перевіряє, що кабінет належить
# саме їй.
[functions.fb-pause]
verify_jwt = false

# Звіт кабінета. Перевірку JWT шлюзом вимкнено з тієї ж причини, що й
# у решти: браузер перед POST шле preflight OPTIONS, а той за
# стандартом іде без Authorization завжди.
#
# Входу за спільним секретом тут немає: звіт замовляє людина, і
# функція сама питає Supabase Auth, хто це, а потім перевіряє, що
# кабінет належить саме їй.
[functions.fb-report]
verify_jwt = false

# Коментарі. Тут два входи, і вони ведуть до РІЗНОГО:
#
#   x-cron-key з розкладу — тільки до дії scan: знайти нові коментарі,
#     сховати їх і написати в Telegram. Приховування оборотне, тому
#     машині його довірити можна;
#
#   токен людини з браузера — до всього іншого, зокрема до delete.
#     Видалення незворотне, і з розкладу воно недосяжне навіть
#     теоретично: у гілці scan код до нього просто не доходить.
[functions.fb-comments]
verify_jwt = false

# Стеля витрат кабінета. Та сама причина, що й у решти браузерних
# входів: перед POST браузер шле preflight OPTIONS, а той за
# стандартом іде БЕЗ Authorization завжди. Зі звичайною перевіркою
# шлюз відкидає саме його — і на екрані стоїть голе «Failed to fetch»:
# не «немає прав», не «не задеплоєно», а зовсім без причини.
#
# Відкритою функція від цього не стає. Без токена вона відповідає 401,
# а з токеном сама питає Supabase Auth, хто прийшов, і кабінет читає
# заголовками тієї людини — межу ставить RLS, а не тіло запиту.
# Входу за спільним секретом тут немає й бути не повинно: підняти
# стелю витрат з розкладу не мусить бути можливо навіть теоретично.
[functions.fb-limit]
verify_jwt = false

# Публікація поста на Сторінку. Причина та сама — preflight. Входу з
# розкладу немає: пост від імені Сторінки пише людина, і функція
# приймає лише номер рядка у fb_posts, який RLS уже визнала її.
[functions.fb-post]
verify_jwt = false

# ЧОТИРИ НИЖЧЕ ВЖЕ ПРАЦЮВАЛИ БЕЗ ЗАПИСУ ТУТ — їх розгортали руками, і
# у файлі вони просто не були записані. Нічого не міняється: це той
# самий стан, тільки тепер видимий і відтворюваний наступним деплоєм.
# Кожна з них перевіряє того, хто прийшов, сама — через Supabase Auth
# або спільний секрет розкладу, — тож шлюз тут і не був тим, що їх
# береже.

# Тексти через ШІ. Кличе людина з браузера; функція сама питає
# Supabase Auth, хто це.
[functions.ai]
verify_jwt = false

# Перевірка доменів. Два входи: нічний розклад за x-cron-key і кнопка
# в дашборді з токеном людини.
[functions.check-domains]
verify_jwt = false

# Перевірка проксі токена. Кличе людина; функція питає Supabase Auth і
# працює лише з токенами цієї людини.
[functions.fb-proxy]
verify_jwt = false

# Правила автоматичного вимикання. Розклад за секретом і людина з
# токеном — як у check-domains.
[functions.fb-rules]
verify_jwt = false

# Розсилка «що нового» в телеграм. Причина та сама — preflight.
# Адресатів функція складає сама, у тілі запиту лише текст; з розкладу
# її не кличе ніхто, бо повідомлення людям не має йти без людини.
[functions.tg-news]
verify_jwt = false
