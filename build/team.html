<!-- ═══════════ TEAM — сторінка тімліда ═══════════

     Питання тімліда не «скільки команда відкрутила», а «в кого
     проблема». Тому перший екран тут — не графік і не сума, а смуга
     «що горить» і список людей: сума по команді нічого не каже про те,
     куди йти дивитись.

     Сторінка тільки показує. Жодної кнопки, яка щось міняє, тут немає
     навмисно: тімлід аналізує, а в роботу баєра не втручається. -->
<div id="team-section" class="card p-5 rounded-3xl shadow-xl">
  <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3 mb-4">
    <div>
      <h2 class="text-lg font-black uppercase tracking-tight text-dynamic">Team</h2>
      <p id="team-sub" class="text-[10px] text-muted-dynamic font-bold uppercase tracking-widest">
        Who is running what, and where it hurts</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <!-- Команда. У тімліда вона одна й не перемикається — показуємо
           підписом. Адмін бачить усі, тож у нього це вибір. -->
      <div id="team-pick"></div>
      <div id="team-range" class="cab-range"></div>
    </div>
  </div>

  <!-- Що горить. Стоїть над усім, бо це те, заради чого сюди заходять;
       картки й список відповідають уже на друге питання — «у кого». -->
  <div id="team-fire" class="mb-4"></div>

  <!-- Ті самі картки, що на дашборді баєра, і навмисно той самий клас
       kpi-card: людина ходить між сторінками, і число в такій самій
       рамці мусить означати таке саме. -->
  <div id="team-kpi" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>

  <!-- Спенд по днях, лінія на баєра. Таблиця показує, ХТО скільки
       витратив; графік — коли це почалось, а це вже інше питання. -->
  <div id="team-chart-wrap" class="card p-4 rounded-2xl mb-4 hidden">
    <div class="flex items-center justify-between mb-2">
      <p class="tm-h" style="margin:0">Spend by day</p>
      <div id="team-legend" class="tm-legend"></div>
    </div>
    <div style="height:180px"><canvas id="team-chart"></canvas></div>
  </div>

  <div class="flex gap-4 items-start">
    <!-- tm-list, а не team-list: id «team-list» уже зайнятий випадайкою
         перемикача команд у шапці. Однакові id — це один вузол на двох
         господарів: getElementById віддає перший, і таблиця баєрів
         малювалась у меню перемикача. -->
    <div id="tm-list" class="flex-1 min-w-0"></div>
    <div id="team-who" class="hidden w-[330px] shrink-0"></div>
  </div>
</div>
