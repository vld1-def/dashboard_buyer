<!-- ═══════ ЗЛІПОК МІСЯЦЯ ═══════ -->
<div id="close-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/65 backdrop-blur-sm" onclick="closeMonthClose()"></div>
  <div class="set-shell relative w-full max-w-3xl flex flex-col overflow-hidden">
    <div class="set-head">
      <div class="flex items-center gap-2.5 shrink-0">
        <svg class="w-4 h-4" style="color:var(--accent)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M9 15l2 2 4-4"/>
        </svg>
        <h2 class="set-title">Month close</h2>
      </div>
      <span id="mc-month" class="set-hint" style="margin:0"></span>
      <span id="mc-saved" class="set-saved">Saved</span>
      <button onclick="closeMonthClose()" class="set-x" title="Close (Esc)">&times;</button>
    </div>

    <div class="set-panes custom-scrollbar">
      <div class="set-group">
        <div class="set-ghead">
          <div>
            <h3 class="set-gtitle">Freeze this month</h3>
            <p class="set-gsub">A snapshot stores the totals exactly as they stand now. Change payouts, re-import data — the frozen number will not move.</p>
          </div>
          <button type="button" id="mc-take" onclick="mcTake()" class="set-btn set-btn-primary">Freeze</button>
        </div>
        <div id="mc-live" class="mc-grid"></div>
      </div>

      <div class="set-group">
        <h3 class="set-gtitle">Saved snapshots</h3>
        <p class="set-gsub">Click a snapshot to compare it with what the dashboard computes today.</p>
        <div id="mc-list"></div>
      </div>

      <div class="set-group hidden" id="mc-diff-group">
        <h3 class="set-gtitle">Frozen vs live · <span id="mc-diff-month"></span></h3>
        <p class="set-gsub" id="mc-diff-when"></p>
        <div id="mc-diff"></div>
      </div>
    </div>
  </div>
</div>
