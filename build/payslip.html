      <!-- PAYSLIP PANEL -->
      <div id="bpanel-slip" class="hidden p-5 space-y-4">
        <div class="ps-controls">
          <div>
            <span class="ps-k">Month</span>
            <select id="ps-month" onchange="psRender()" class="set-input w-full"></select>
          </div>
          <div>
            <span class="ps-k">Source</span>
            <select id="ps-source" onchange="psRender()" class="set-input w-full">
              <option value="snap">Frozen snapshot</option>
              <option value="live">Live numbers</option>
            </select>
          </div>
          <div>
            <span class="ps-k">Profit basis</span>
            <select id="ps-basis" onchange="psRender()" class="set-input w-full">
              <option value="net">Net (minus expenses)</option>
              <option value="gross">Gross</option>
            </select>
          </div>
        </div>

        <div class="ps-controls">
          <div>
            <span class="ps-k">Base / fixed part, $</span>
            <input type="number" id="ps-base" step="1" placeholder="0" oninput="psRender()" onchange="psSaveBase()" class="set-input w-full">
          </div>
          <div>
            <span class="ps-k">Advances already taken, $</span>
            <input type="number" id="ps-adv" step="1" placeholder="0" oninput="psRender()" onchange="psSaveAdv()" class="set-input w-full">
          </div>
          <div class="flex items-end">
            <button type="button" onclick="psCopy()" class="set-btn set-btn-primary w-full">Copy</button>
          </div>
        </div>

        <div id="ps-out" class="ps-sheet"></div>
        <p id="ps-note" class="set-hint"></p>
      </div>
