<!DOCTYPE html>
<html class="dark" id="main-html">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Перемальовуємо палітру Tailwind під новий дизайн.
       Важливо: половина розмітки збирається в JS рядками з класами
       text-slate-400 / bg-slate-900 / border-slate-700 — перевизначивши
       саму шкалу, ми міняємо вигляд усього згенерованого коду теж. */
    const _neutral = {
      50:'#F7F7F8', 100:'#ECECEF', 200:'#D7D7DD', 300:'#B2B2BC',
      400:'#8A8A95', 500:'#6C6C76', 600:'#53535C', 700:'#38383F',
      800:'#222226', 900:'#131316', 950:'#0A0A0C'
    };
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter','ui-sans-serif','system-ui','-apple-system','Segoe UI','sans-serif'],
            mono: ['JetBrains Mono','ui-monospace','SFMono-Regular','monospace']
          },
          colors: { slate: _neutral, gray: _neutral, zinc: _neutral, neutral: _neutral }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- ?v=2 не прикраса: браузери тримають favicon у кеші довго й уперто,
       і без зміни адреси стара іконка лишалась би на вкладці тижнями. -->
  <link rel="icon" type="image/png" href="icon.png?v=2">
  <link rel="apple-touch-icon" href="icon.png?v=2">
