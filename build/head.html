<!DOCTYPE html>
<html class="dark" id="main-html">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- TAILWIND БІЛЬШЕ НЕ З CDN. cdn.tailwindcss.com компілював CSS прямо
       в браузері: на старті сканував увесь документ (2.9 МБ), а потім
       перекомпільовував стилі на КОЖНУ зміну розмітки — тобто на кожен
       рендер карток, таблиць і графіків, поки йшло «Loading data». Тепер
       CSS збирається один раз у build.py (build/tw) у файл tw.css, який
       браузер кешує. Посилання стоїть у кінці <head> (див. build.py) —
       там, куди CDN дописував свої стилі, тож порядок каскаду той самий. -->
  <!-- ГРАФІКИ ТУТ БІЛЬШЕ НЕ ЗАВАНТАЖУЮТЬСЯ. Chart.js із плагіном — це
       ~250 КБ, які стояли в <head> синхронно: парсер спинявся на них
       ДО того, як браузер доходив до розмітки, і перший запит по дані
       йшов аж після того, як обидва файли доїхали й виконались. А
       жоден графік не потрібен, щоб показати сторінку.
       Тепер їх тягне cfLib() — перед першим графіком. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- З'єднання з базою ставимо ЗАРАЗ, паралельно з розбором сторінки:
       перший запит інакше починається з DNS, TLS і рукостискання, і це
       видно секундою на мобільному. -->
  <link rel="preconnect" href="https://zsfumuiajrytmeycbtnn.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <!-- ?v=2 не прикраса: браузери тримають favicon у кеші довго й уперто,
       і без зміни адреси стара іконка лишалась би на вкладці тижнями. -->
  <link rel="icon" type="image/png" href="icon.png?v=2">
  <link rel="apple-touch-icon" href="icon.png?v=2">
