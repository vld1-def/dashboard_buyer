<!-- ═══════════ СТОРІНКИ Й КОМЕНТАРІ ПІД НИМИ ═══════════
     Панель праворуч на сторінці кабінетів — у тому самому місці й тим
     самим рухом, що правила. Кабінетний шлях до коментарів лишається в
     картці кабінета: він відповідає на інше питання («що пишуть під
     оголошеннями ЦЬОГО кабінета»), і одне не замінює друге. -->
<div class="card p-4 rounded-3xl shadow-xl rl-wrap">

    <div class="pg-head rl-head">
      <div>
        <h2>Pages</h2>
      </div>
      <button type="button" class="rl-x" onclick="pgPanel(false)" title="Close">&times;</button>
    </div>

    <div class="rl-acts">
      <button type="button" class="rl-btn" onclick="pgLoad(true)" id="pg-refresh">Refresh</button>
      <input id="pg-q" oninput="pgPaint()" placeholder="Page…" class="pg-q">
    </div>

    <div class="rl-body custom-scrollbar">
      <p class="rl-note" id="pg-note"></p>
      <div id="pg-list"></div>
    </div>
</div>
