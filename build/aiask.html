<!-- ═══════════ АСИСТЕНТ: ЧАТ ПО ТАБЛИЦІ ═══════════
     Вікно, а не сторінка: питання виникає посеред роботи —
     подивився число й повернувся туди ж, де був.

     ЧОМУ ЧАТ. Питання тут майже ніколи не одне: перше уточнюють
     другим («а без Decline?», «а по гео?»). Один екран, що
     перемальовувався від початку, щоразу забирав попередню відповідь —
     і порівняти два числа було нічим.

     ТАБЛИЦЮ ВИБИРАЮТЬ, А НЕ НАЗИВАЮТЬ. Набір стоїть списком у шапці:
     набирати його назву в питанні — робота, якої можна не робити, і
     джерело помилок, якого можна не мати.

     Під кожною відповіддю — ОДИН рядок: план, за яким вийшло число.
     Число без плану перевірити нічим, окрім того ж підрахунку
     вручну — тобто роботи, заради якої й питали. -->
<div id="aq-modal" class="hidden fixed inset-0 z-[150] modal-overlay flex items-center justify-center p-4"
     onclick="if(event.target===this) aqClose()">
  <div class="card w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="height:84vh">
    <div class="p-4 px-5 border-b border-white/5 flex justify-between items-center bg-white/[0.02] flex-shrink-0 gap-3 flex-wrap">
      <div class="min-w-0">
        <h2 class="mw-title">Асистент</h2>
        <p class="mw-sub" id="aq-sub"></p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <!-- Який набір питаємо. Списком, бо наборів рівно стільки,
             скільки відкрито, і всі вони вміщаються в один рядок. -->
        <select id="aq-set" class="mw-fld" style="width:auto;max-width:260px"
          onchange="aqPick(this.value)"></select>
        <button type="button" onclick="aqClose()" class="mw-x" title="Закрити">&times;</button>
      </div>
    </div>

    <!-- Стрічка. Нове знизу, як у будь-якому чаті. -->
    <div id="aq-thread" class="aq-thread flex-1 min-h-0 overflow-y-auto custom-scrollbar"></div>

    <div class="aq-foot flex-shrink-0">
      <!-- Поле росте під текст і тягнеться за ріжок: питання буває і в
           три слова, і в три рядки. -->
      <textarea id="aq-q" class="aq-in" rows="1" spellcheck="false"
        placeholder="Спитай словами: сума Spend без статуса Decline"
        oninput="aqGrow(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aqAsk();}"></textarea>
      <button type="button" class="aq-send" id="aq-go" onclick="aqAsk()" title="Спитати (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>
