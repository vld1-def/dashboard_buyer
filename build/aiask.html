<!-- ═══════════ АСИСТЕНТ: ПИТАННЯ СЛОВАМИ ═══════════
     Вікно, а не сторінка: питання виникає посеред роботи — подивився
     число й повернувся туди ж, де був.

     Відповідь складається з ДВОХ частин, і друга важливіша за першу:
     саме число й ПЛАН, за яким його порахували. Число без плану
     перевірити нічим, окрім того ж підрахунку вручну — тобто роботи,
     заради якої й питали. -->
<div id="aq-modal" class="hidden fixed inset-0 z-[150] modal-overlay flex items-center justify-center p-4"
     onclick="if(event.target===this) aqClose()">
  <div class="card w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="max-height:88vh">
    <div class="p-5 border-b border-white/5 flex justify-between items-center bg-white/[0.02] flex-shrink-0 gap-4 flex-wrap">
      <div>
        <h2 class="mw-title">Асистент</h2>
        <p class="mw-sub" id="aq-sub"></p>
      </div>
      <div class="mw-acts">
        <button type="button" onclick="aqClose()" class="mw-x" title="Закрити">&times;</button>
      </div>
    </div>

    <div class="p-5 flex-1 min-h-0 overflow-y-auto custom-scrollbar">
      <div class="aq-bar">
        <input id="aq-q" class="mw-fld" placeholder="напр. сума Spend без статуса Decline"
          onkeydown="if(event.key==='Enter'){event.preventDefault();aqAsk();}">
        <button type="button" class="mw-btn is-main" id="aq-go" onclick="aqAsk()">Спитати</button>
      </div>
      <!-- Що саме їде в модель — сказано тут, а не в документації, якої
           ніхто не відкриває. Назви стовпців їдуть, значення ні. -->
      <p class="aq-privacy">У модель їде питання і <b>назви стовпців</b>. Самі дані лишаються в
        браузері: фільтрує й рахує дашборд, а не модель.</p>
      <div id="aq-sets" class="aq-sets"></div>
      <div id="aq-out" class="aq-out"></div>
    </div>
  </div>
</div>
