<!-- ═══════════ FB LIVE (кабінети) ═══════════ -->
<div id="cabinets-section" class="card p-5 rounded-3xl shadow-xl">
  <!-- ШАПКА В ОДИН РЯД, ТРИ ЧАСТИНИ: зліва — що це й скільки
       відкручено, по центру — пошук, праворуч — інструменти.
       «по центру пусте місце»: пошук стояв посередині ВІЛЬНОГО місця,
       а не картки, і з'їжджав щоразу, коли сусіди мінялись у ширині.
       Тепер ліва й права частини — рівні колонки сітки, і пошук
       лягає рівно в центр картки (див. .cab-head у design.css).

       Обгортки .cab-hl / .cab-hr на телефоні — display:contents: там
       шапка згорнута в один ряд, і порядок задає order на самих
       кнопках, ніби обгорток немає.

       Кнопок періоду (Today / Yesterday / This month / Custom) тут
       більше немає: сторінка — FB LIVE, тобто сьогодні. Інший день
       дивляться календарем у вікні Stat. Day. -->
  <div class="cab-head">
    <div class="cab-hl">
      <!-- «FB LIVE зроби назву іконку + live»: значок Facebook і «Live» з
           пульсуючою крапкою, як у трансляції. Для читалок — повна назва. -->
      <h2 class="cab-title text-lg font-black tracking-tight text-dynamic" aria-label="FB Live"><span
        class="cab-t-fb" aria-hidden="true"><svg viewBox="0 0 16 16"><path fill="currentColor"
        d="M9.2 15.5V9.3h2.1l.3-2.4H9.2V5.4c0-.7.2-1.2 1.2-1.2h1.3V2.1c-.2 0-1-.1-1.9-.1-1.9 0-3.2 1.2-3.2 3.3v1.6H4.5v2.4h2.1v6.2z"/></svg></span><span
        class="cab-t-live" aria-hidden="true"><i class="cab-t-dot"></i>Live</span></h2>
      <!-- Скільки відкручено сьогодні. Кнопка, а не підпис: натиснув —
           і замість зведеного в долари числа видно, з яких валют воно
           складене. -->
      <!-- Сума за сьогодні — перший із показників поруч. Окрему кнопку
           Today прибрали на прохання: FB LIVE і так показує сьогодні. -->
      <button type="button" id="cab-sum" class="cab-sum" onclick="cabSumToggle()"></button>
      <!-- Числа за день, згруповані по гео, кабінетах, воронках і
           креативах; у вікні ж і календар на минулі дні. Вікно, а не
           панель: таблиці потрібна вся ширина. -->
      <button type="button" id="cab-today-btn" onclick="tdToggle()" class="cab-rules"
        title="The day’s numbers by geo, cabinet, funnel and creative — with a calendar for earlier days">Stat. Day</button>
    </div>
    <!-- Лише телефон: лупа відкриває пошук, Filters — решту
         (групування, кнопки, статуси). -->
    <button type="button" id="cab-q-btn" onclick="cabQToggle()" class="cab-rules cab-ico cab-m-only"
      title="Search" aria-label="Search"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7"
        r="4.4"/><path d="M10.4 10.4l3.4 3.4"/></svg></button>
    <button type="button" id="cab-flt-btn" onclick="cabFltToggle()" class="cab-rules cab-m-only"
      aria-expanded="false" title="Grouping, tools and status filters"><span
        id="cab-flt-lbl">Filters</span> <span class="cab-flt-car" aria-hidden="true">▾</span></button>
    <input id="cab-search" oninput="cabRender()" placeholder="Account, agent, card, note, campaign…"
      class="bg-black/25 border border-white/10 rounded-xl px-3 py-2 text-[10px] font-bold text-dynamic outline-none w-48 focus:border-violet-500">
    <div class="cab-hr">
      <!-- Три інструменти одним блоком, а не трьома окремими кнопками:
           колонки, правила автопаузи й Сторінки — це «налаштувати й
           подивитись поруч», і разом вони читаються як одна група, а
           не як ще три рівноважні кнопки в ряду. -->
      <div class="cab-tools">
        <!-- «список GROUP зробити в стилі кнопки так як RULES PAGES і
             помістити в цей список кнопок». Той самий select, але без
             власної рамки: він тепер перший у блоці інструментів і
             виглядає як сусідні кнопки. -->
        <select id="cab-group" onchange="cabSetGroup(this.value)" class="cab-rules cab-grp"
          title="Group the cabinets" aria-label="Group">
          <option value="agent">Group: agent</option>
          <option value="state">Group: state</option>
          <option value="profile">Group: browser</option>
          <option value="bm">Group: BM</option>
          <!-- «цікаво стало побачити які кабінети привязані до картки».
               Картку Facebook уже віддає разом із кабінетом; тут вона стає
               ще одним способом скласти список. -->
          <option value="card">Group: card</option>
          <option value="" selected>Group</option>
        </select>
        <!-- «біля group додати вкладку filter (але тільки з іконкою)»:
             мітки гео й «мали спенд сьогодні». Крапка на іконці — фільтр
             увімкнений, тобто список показує не все. -->
        <button type="button" id="cab-filt-btn" onclick="cabFiltMenu()" class="cab-rules cab-ico"
          title="Filter: geo labels, spend today" aria-label="Filter"><svg viewBox="0 0 16 16"
            aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linejoin="round"><path d="M2.2 3h11.6L9.4 8.4v4.2l-2.8 1.4V8.4z"/></svg><i
            class="cab-filt-dot" aria-hidden="true"></i></button>
        <button type="button" id="cab-cols-btn" onclick="cabColsMenu()" class="cab-rules cab-ico"
          title="Which columns to show" aria-label="Columns"><svg viewBox="0 0 16 16" aria-hidden="true"
            fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.8" y="2.4" width="12.4"
            height="11.2" rx="1.6"/><path d="M6.4 2.4v11.2M9.6 2.4v11.2"/></svg></button>
        <!-- «решту дай також іконки pages rules та інші»: усі інструменти
             іконками, назва — у підказці при наведенні. -->
        <button type="button" id="cab-rules-btn" onclick="rlPanel()" class="cab-rules cab-ico"
          title="Rules — switch off ads on their own" aria-label="Rules"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.8 3.4 9h4.2L7 14.2 12.6 7H8.4z"/></svg></button>
        <button type="button" id="cab-pages-btn" onclick="pgPanel()" class="cab-rules cab-ico"
          title="Pages — the pages your tokens reach, and the comments under them" aria-label="Pages"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 14.2V2.2"/><path d="M3.2 2.6h8.6l-1.8 3 1.8 3H3.2"/></svg></button>
        <button type="button" id="cab-tpl-btn" onclick="ltPanel()" class="cab-rules cab-ico"
          title="Templates — saved campaigns you launch into any cabinet" aria-label="Templates"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="4.6" width="9" height="9" rx="1.6"/><path d="M11.4 4.6V3.4a1.2 1.2 0 0 0-1.2-1.2H3.4a1.2 1.2 0 0 0-1.2 1.2v6.8a1.2 1.2 0 0 0 1.2 1.2h1.2"/></svg></button>
      </div>
      <button type="button" id="cab-sync" onclick="cabSync()" class="cab-sync"
        title="Sync now — ask Facebook right now instead of waiting for the hourly run"
        aria-label="Sync now"><span class="cab-sync-lbl" aria-hidden="true">↻</span><span
          class="cab-sync-w" aria-hidden="true">Sync</span><span
          id="cab-sync-ago" class="cab-syncago"></span></button>
    </div>
  </div>

  <!-- Результат синхронізації. Порожній, поки нічого не запускали —
       місця не займає. -->

  <div id="cab-tiles" class="mb-4"></div>

  <!-- Стрічка змін переїхала в тости: зайшов, побачив, воно зникло саме.
       Вузол лишається — у ньому зʼявляється хіба що попередження, що
       журнал недоступний. Історія конкретного кабінета — у його панелі. -->
  <div id="cab-feed"></div>

  <!-- Смуга дії над вибраними. Стоїть між плитками й таблицею, а не
       над карткою: дія стосується рядків, і відводити її від них не
       можна. Порожня, поки нічого не вибрано — місця не займає. -->
  <div id="cab-bulk"></div>

  <!-- cab-row — щоб на телефоні цей ряд міг перенестись: списку,
       картці й правилам там нема як стояти поруч. -->
  <div class="cab-row flex gap-4 items-start">
    <div id="cab-list" class="flex-1 min-w-0 space-y-1.5"></div>
    <div id="cab-detail" class="hidden w-[330px] shrink-0"></div>
    <!-- Ширина тут, а не класом w-[420px]: довільні значення Tailwind
         існують лише якщо їх знайшов збирач, і варто класу не потрапити
         в збірку — панель роздувається на всю таблицю. На цьому вже
         обпеклись із панеллю кабінета. -->
    <div id="rules-panel" class="hidden shrink-0" style="width:452px"></div>
    <!-- Те саме праве місце, що й у правил: панелі взаємно
         виключаються (див. pgPanel), бо дві поруч розчавили б таблицю. -->
    <div id="pages-panel" class="hidden shrink-0" style="width:452px"></div>
  </div>

  <!-- Що всередині кабінета — кампанії, адсети, оголошення — більше не
       живе під таблицею. Воно відкривається стрілкою в самому рядку, і
       вузли #cab-inside-bar та #cab-inside малюються там (див.
       cabRowHtml). Тут їх немає навмисно: два вузли з одним id — це
       те, після чого cabdrill пише в перший-ліпший. -->

  <!-- Плаваючий список: колонки або дії над кабінетом. Один на обидва,
       і поза таблицею — всередині неї довгий список обрізається краєм
       прокрутки рівно тоді, коли він довгий. -->
  <div id="cab-pop" class="cab-pop hidden"></div>

  <!-- Сторінки, з яких крутять ці кабінети. Під таблицею, а не над:
       спершу те, за чим приходять щодня, потім те, на що дивляться,
       коли виникло питання «а звідки воно взагалі йде». -->
</div>
