<!-- ═══════════ ПРАВИЛА АВТОМАТИЧНОГО ВИМИКАННЯ ═══════════
     Панель праворуч на сторінці кабінетів, поруч із карткою кабінета:
     правила — про той самий парк, і окремий пункт меню про них був
     зайвим кроком у бік. -->
<div class="card p-4 rounded-3xl shadow-xl rl-wrap">

    <div class="rl-head">
      <div>
        <h2>Rules</h2>
        <p class="panel-sub">What gets switched off on its own, and why</p>
      </div>
      <button type="button" class="rl-x" onclick="rlPanel(false)" title="Close">&times;</button>
    </div>

    <div class="rl-acts">
      <button type="button" class="rl-btn is-main" onclick="rlAdd()">+ Rule</button>
      <button type="button" class="rl-btn" onclick="rlCheck()">Check now</button>
    </div>

    <div class="rl-body custom-scrollbar">
      <p class="rl-note" id="rl-note"></p>

      <div id="rl-list"></div>

      <!-- Списку «що вважати лідом» тут більше немає, і в налаштуваннях
           теж. Лід — це подія пікселя, одна й та сама тут і в кампаніях.
           Вибір, який мовчки міняв число в десяти місцях, коштував
           дорожче за гнучкість, якою користувались раз на рік. -->

      <div class="rl-grp">
        <h3 class="rl-grp-h">Last actions</h3>
        <p class="rl-grp-s">What the rules did, newest first. An eye means report-only: the rule matched but nothing was touched.</p>
        <div id="rl-log" class="rl-log"></div>
      </div>

    </div>
</div>
