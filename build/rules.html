<!-- ═══════════ ПРАВИЛА АВТОМАТИЧНОГО ВИМИКАННЯ ═══════════
     Панель праворуч на сторінці кабінетів, поруч із карткою кабінета:
     правила — про той самий парк, і окремий пункт меню про них був
     зайвим кроком у бік. -->
<div class="card p-4 rounded-3xl shadow-xl rl-wrap">

    <!-- КОМПАКТНА ШАПКА: назва й обидві дії одним рядком. Що правила
         ходять кожні 15 хвилин і що нове правило лише звітує — у
         підказці назви, а не окремим рядком. -->
    <div class="rl-head">
      <h2 title="Rules run every 15 min · a new rule only reports until you allow it to switch things off">Rules</h2>
      <div class="rl-acts">
        <button type="button" class="rl-btn is-main" onclick="rlAdd()">+ Rule</button>
        <button type="button" class="rl-btn" onclick="rlCheck()" title="Run all rules now in report-only mode">Check now</button>
      </div>
      <button type="button" class="rl-x" onclick="rlPanel(false)" title="Close">&times;</button>
    </div>

    <div class="rl-body custom-scrollbar">
      <p class="rl-note" id="rl-note"></p>

      <!-- Кабінети, на які не дивиться жодне правило (rlSkipPaint). -->
      <div id="rl-skip" class="rl-skip"></div>

      <div id="rl-list"></div>

      <!-- Списку «що вважати лідом» тут більше немає, і в налаштуваннях
           теж. Лід — це подія пікселя, одна й та сама тут і в кампаніях.
           Вибір, який мовчки міняв число в десяти місцях, коштував
           дорожче за гнучкість, якою користувались раз на рік. -->

      <div class="rl-grp">
        <h3 class="rl-grp-h" title="What the rules did, newest first. An eye means report-only: the rule matched but nothing was touched. Hover a line for the numbers.">Last actions</h3>
        <!-- КОЛИ ПРАВИЛА ПРОХОДИЛИ ОСТАННІЙ РАЗ. Порожній журнал без
             цього рядка означав одразу дві протилежні речі: «ходять,
             нічого не підпадає» і «не ходять узагалі». Перше не
             потребує нічого, друге — деплою, секрета або розкладу. -->
        <div id="rl-run" class="rl-run"></div>
        <div id="rl-log" class="rl-log"></div>
      </div>

    </div>
</div>
