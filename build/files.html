<!-- ═══════════ ФАЙЛИ ═══════════
     Модалка, як Accounts, а не окремий маршрут. По файл заходять між
     справами: подивився — закрив і повернувся туди ж, де був. Маршрут
     ламав саме це, бо міняв сторінку під ногами. -->
<div id="files-modal" class="hidden fixed inset-0 z-[120] modal-overlay flex items-center justify-center p-4"
     onclick="if(event.target===this) closeFilesModal()">
  <div class="card w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="max-height:88vh">
    <div class="p-5 border-b border-white/5 flex justify-between items-center bg-white/[0.02] flex-shrink-0">
      <div>
        <h2 class="text-xl font-black italic tracking-tighter text-amber-300">Files</h2>
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-0.5">Drop a file anywhere in this window</p>
        <!-- Куди лягає файл. Бакет приватний і прямого посилання немає,
             тож без цього рядка видно лише список і жодного «де». -->
        <p id="fl-where" class="fl-where"></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="fl-count" class="fl-count"></span>
        <input id="fl-q" oninput="flRender()" placeholder="Search…"
          class="bg-black/30 border border-white/10 rounded-lg px-3 py-1.5 text-xs font-bold text-white outline-none focus:border-amber-400 w-40">
        <button type="button" onclick="flPick()" class="fl-btn is-main">+ Upload</button>
        <input type="file" id="fl-input" multiple onchange="flChose(this.files)">
        <button onclick="closeFilesModal()" class="text-slate-400 hover:text-red-500 transition text-lg">✕</button>
      </div>
    </div>
    <!-- Кидати файл можна на все вікно, а не лише на кнопку: коли він уже
         в руці, цілитись у маленьку мішень — зайва робота. -->
    <div id="fl-drop" class="fl-drop flex-1 min-h-0 overflow-y-auto custom-scrollbar p-5 pt-4">
      <div id="fl-view" class="hidden"></div>
      <div id="fl-list"></div>
    </div>
  </div>
</div>
