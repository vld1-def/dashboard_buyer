<!DOCTYPE html>
<html class="dark" lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Lead</title>
<link rel="icon" type="image/png" href="icon.png">
<!-- Дизайн береться з того самого файлу, що вшивається в дашборд. Отже
     наступна зміна токенів доїде і сюди, без копії кольорів у цьому
     файлі. ?v піднімати руками: ця сторінка не збирається build.py. -->
<link rel="stylesheet" href="build/design.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ТІЛЬКИ РОЗКЛАДКА ЦІЄЇ СТОРІНКИ. Кольори, радіуси й шрифт — з
   design.css. Тут навмисно немає Tailwind: він вантажиться з CDN, а
   сторінку тімліда відкривають з чужих мереж, де той CDN буває
   закритий — і тоді від неї лишився б голий текст. Звичайний CSS
   працює завжди, і його ще й видно стендам. */
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
.tl-wrap { display: flex; min-height: 100vh; }

/* ─────────── своє меню ─────────── */
/* ═══════════ САЙДБАР ═══════════

   Попередній був рядом однакових кнопок із кружечком: усі пункти
   важили однаково, і око не мало за що зачепитись. Тут три речі, які
   це лагодять:

   1. ЗНАЧКИ, а не кружечки. Різні силуети розрізняються периферійним
      зором — у список перестаєш вчитуватись уже на другий день.
   2. ГРУПИ з підписами: «зараз» і «аналітика». Ранкові екрани і
      розбори минулого — це різні заходи на сторінку, і змішаний
      список змушував щоразу перечитувати все.
   3. ЛІЧИЛЬНИКИ на пунктах. Скільки тривог і скільки перелитих капів
      видно ДО того, як туди зайшов: меню саме каже, куди сьогодні
      варто глянути. */
.tl-side {
  width: 236px; flex-shrink: 0; padding: 14px 10px 14px 12px;
  background: linear-gradient(180deg, var(--bg-soft), var(--bg) 60%);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.tl-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; }
.tl-brand .tl-logo {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #6366F1);
  color: #fff; font-size: 13px; font-weight: 900; letter-spacing: -.02em;
  box-shadow: 0 6px 18px -8px var(--accent);
}
.tl-brand b { display: block; font-size: 13px; font-weight: 800; color: var(--text-main); line-height: 1.2; }
.tl-brand span {
  display: block; margin-top: 2px; font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px;
}
.tl-grp {
  margin: 12px 0 5px; padding: 0 8px;
  font-size: 9px; font-weight: 800; letter-spacing: .16em;
  text-transform: uppercase; color: var(--text-muted); opacity: .65;
}
.tl-nav {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; margin-bottom: 2px; border: 0; border-radius: 10px;
  cursor: pointer; background: transparent; color: var(--text-muted);
  font: inherit; font-size: 12.5px; font-weight: 700; text-align: left;
  transition: background .13s, color .13s;
}
.tl-nav:hover { background: var(--surface-2); color: var(--text-main); }
.tl-nav.is-on { background: var(--surface-2); color: var(--text-main); }
/* Смужка зліва замість заливки всієї кнопки: активний пункт видно, а
   сайдбар не перетворюється на пляму кольору. */
.tl-nav.is-on::before {
  content: ''; position: absolute; left: -12px; top: 7px; bottom: 7px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.tl-nav svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .75; }
.tl-nav.is-on svg { opacity: 1; color: var(--accent); }
.tl-nav .tl-cnt {
  margin-left: auto; min-width: 18px; padding: 1px 6px; border-radius: 999px;
  font-size: 10px; font-weight: 800; text-align: center;
  background: var(--surface-3); color: var(--text-muted);
}
.tl-nav .tl-cnt.is-bad { background: rgba(239,68,68,.18); color: #FCA5A5; }
.tl-nav .tl-cnt.is-warn { background: rgba(234,179,8,.18); color: #FDE68A; }
.tl-side-foot { margin-top: auto; padding: 12px 6px 0; border-top: 1px solid var(--border); }
.tl-side-foot p { margin: 0 0 6px; font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.tl-me { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 0 2px; }
.tl-me .tl-ava {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  background: var(--surface-3); color: var(--text-main); font-size: 10px; font-weight: 800;
}
.tl-me small { font-size: 10px; font-weight: 700; color: var(--text-muted); line-height: 1.3; }
.tl-me small b { display: block; color: var(--text-main); font-size: 11px; }

/* ─────────── основна частина ─────────── */
.tl-main { flex: 1; min-width: 0; padding: 18px 20px 32px; }
.tl-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.tl-top h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: var(--text-main); }
.tl-top .tl-sub { margin: 2px 0 0; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.tl-sel {
  margin-left: auto; background: var(--surface-2); color: var(--text-main);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 7px 10px; font: inherit; font-size: 12px; font-weight: 700; outline: none;
}
.tl-sel:focus { border-color: var(--accent-bd); }

.tl-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tl-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.tl-kpi p { margin: 0; font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); }
.tl-kpi b { display: block; margin-top: 5px; font-size: 23px; font-weight: 800; letter-spacing: -.03em; color: var(--text-main); }
.tl-kpi .tl-note { display: block; margin-top: 3px; font-size: 10px; font-weight: 700; color: var(--text-muted); }
.is-ok { color: var(--ok) !important; }
.is-bad { color: var(--bad) !important; }

.tl-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.tl-panel > header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tl-panel > header h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-main); }
.tl-panel > header p { margin: 3px 0 0; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }

table.tl-tbl { width: 100%; border-collapse: collapse; }
.tl-tbl th {
  padding: 9px 14px; text-align: right; font-size: 9px; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.tl-tbl th:first-child, .tl-tbl td:first-child { text-align: left; }
.tl-tbl td { padding: 9px 14px; text-align: right; font-size: 12px; font-weight: 700; color: var(--text-main); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tl-tbl tbody tr:last-child td { border-bottom: 0; }
.tl-tbl tbody tr:hover td { background: var(--surface-2); }
.tl-tbl tfoot td { padding: 10px 14px; text-align: right; font-size: 12px; font-weight: 800; color: var(--text-main); border-top: 1px solid var(--border-2); background: var(--surface-2); }
.tl-tbl tfoot td:first-child { text-align: left; }
.tl-name { display: flex; align-items: center; gap: 8px; }
.tl-name img { width: 18px; height: 13px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }
.tl-muted { color: var(--text-muted); font-weight: 700; }

.tl-chip {
  display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px;
  font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  background: var(--surface-3); color: var(--text-muted); border: 1px solid var(--border);
}
.tl-chip.is-lead { background: var(--accent-soft); border-color: var(--accent-bd); color: var(--text-main); }
/* Людина в команді є, а рядків за цей місяць у неї немає. Нуль у
   стовпці спенду сказав би «крутив і не витратив», що неправда. */
.tl-idle td:not(:first-child) { color: var(--text-muted); font-weight: 700; }
/* ПЛАШКА МАКЕТА. На сторінці поруч живуть справжні числа (Огляд,
   Моя команда, Гео, Місяці читають базу) і намальовані (Капи,
   Сьогодні). Без видимої межі між ними сторінка стала б такою, де
   не видно, де правда — а саме через це колись і прилетіло за «фейк
   інфу». Тому плашка велика, кольорова і стоїть НАД блоком. */
.tl-mock {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  padding: 8px 12px; border-radius: 10px;
  background: rgba(234, 179, 8, .12); border: 1px solid rgba(234, 179, 8, .34);
  font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: #FDE68A;
}
.tl-mock b { font-weight: 900; }

/* Смужка наповнення капи. Ширина — відсоток, колір — стан. */
.tl-bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; min-width: 90px; }
.tl-bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.tl-bar.is-close i { background: var(--warn); }
.tl-bar.is-full i { background: var(--ok); }
.tl-bar.is-over i { background: var(--bad); }

.tl-tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  background: var(--surface-3); color: var(--text-muted); border: 1px solid var(--border);
}
.tl-tag.is-ok   { background: rgba(34,197,94,.14);  border-color: rgba(34,197,94,.34);  color: #86EFAC; }
.tl-tag.is-warn { background: rgba(234,179,8,.14);  border-color: rgba(234,179,8,.34);  color: #FDE68A; }
.tl-tag.is-bad  { background: rgba(239,68,68,.14);  border-color: rgba(239,68,68,.34);  color: #FCA5A5; }

/* Смуга підсумку над таблицею капів: три числа, які тімлід читає
   першими, перш ніж дивитись рядки. */
.tl-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tl-strip > div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.tl-strip p { margin: 0; font-size: 9px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.tl-strip b { display: block; margin-top: 4px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }

/* Картка тривоги: що сталось, у кого, і що з цим робити. Без
   третього рядка це просто червоний текст, на який перестають
   дивитись на другий день. */
.tl-alert { display: flex; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--border); }
.tl-alert:last-child { border-bottom: 0; }
.tl-alert .tl-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.tl-alert h4 { margin: 0 0 2px; font-size: 12px; font-weight: 800; color: var(--text-main); }
.tl-alert p  { margin: 0; font-size: 11px; font-weight: 600; color: var(--text-muted); line-height: 1.5; }
.tl-alert em { font-style: normal; color: var(--text-main); font-weight: 700; }

/* ДОШКА ТАСКІВ. Колонка на людину, а не колонка на статус: тімлід
   дивиться «хто чим зайнятий», а не «скільки всього в роботі».
   Статус видно на самій картці. */
.tl-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; padding: 0 14px 14px; }
.tl-col > header { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; }
.tl-col > header b { font-size: 12px; font-weight: 800; color: var(--text-main); }
.tl-col > header span { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--text-muted); }
.tl-card {
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 3px solid var(--border-2);
  border-radius: 10px; padding: 9px 10px; margin-bottom: 7px;
}
.tl-card.p-high { border-left-color: var(--bad); }
.tl-card.p-mid  { border-left-color: var(--warn); }
.tl-card.p-low  { border-left-color: var(--border-2); }
.tl-card h5 { margin: 0 0 4px; font-size: 12px; font-weight: 700; color: var(--text-main); line-height: 1.35; }
.tl-card .tl-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tl-card.is-done { opacity: .55; }
.tl-card.is-done h5 { text-decoration: line-through; }
/* Таск, який поставила система, а не людина. Позначка потрібна: інакше
   незрозуміло, з ким про нього говорити, і чи він узагалі обговорений. */
.tl-auto {
  display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px;
  font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  background: var(--accent-soft); border: 1px solid var(--accent-bd); color: #C4B5FD;
}
.tl-empty { padding: 42px 16px; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.tl-gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.tl-gate .tl-panel { max-width: 420px; width: 100%; }
.tl-gate p { margin: 0 0 10px; font-size: 12px; line-height: 1.6; color: var(--text-muted); font-weight: 600; }
.tl-gate code { color: var(--text-main); font-size: 11px; }
@media (max-width: 760px) {
  .tl-wrap { display: block; }
  .tl-side { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); }
  .tl-brand, .tl-side-foot { width: 100%; }
  .tl-side-foot { margin-top: 8px; }
}
</style>
</head>
<body>

<div id="tl-gate" class="tl-gate" style="display:none">
  <div class="tl-panel">
    <header><h2 id="tl-gate-h">Доступ закрито</h2></header>
    <div style="padding:14px">
      <p id="tl-gate-p"></p>
    </div>
  </div>
</div>

<div id="tl-app" class="tl-wrap" style="display:none">
  <aside class="tl-side">
    <div class="tl-brand">
      <span class="tl-logo">TL</span>
      <span style="min-width:0">
        <b>Team Lead</b>
        <span id="tl-team">—</span>
      </span>
    </div>

    <p class="tl-grp">Зараз</p>
    <button class="tl-nav is-on" data-sec="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      Сьогодні<span class="tl-cnt is-bad" id="tl-cnt-today">7</span></button>
    <button class="tl-nav" data-sec="caps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15a9 9 0 1 1 18 0"/><path d="m12 15 4-5"/><circle cx="12" cy="15" r="1.6"/></svg>
      Капи<span class="tl-cnt is-warn" id="tl-cnt-caps">2</span></button>
    <button class="tl-nav" data-sec="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4"/></svg>
      Таски<span class="tl-cnt" id="tl-cnt-tasks">5</span></button>

    <p class="tl-grp">Аналітика</p>
    <button class="tl-nav" data-sec="team">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
      Команда</button>
    <button class="tl-nav" data-sec="geo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
      Гео</button>
    <button class="tl-nav" data-sec="month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 20V9M12 20V4M17 20v-7"/></svg>
      Місяці</button>

    <div class="tl-side-foot">
      <p>Місяць</p>
      <select id="tl-month" class="tl-sel" style="margin:0;width:100%"></select>
      <div class="tl-me">
        <span class="tl-ava" id="tl-ava">?</span>
        <small><b id="tl-me-name">—</b><span id="tl-me-role">—</span></small>
      </div>
    </div>
  </aside>

  <main class="tl-main">
    <div class="tl-top">
      <div>
        <h1 id="tl-title">Огляд</h1>
        <p class="tl-sub" id="tl-period">—</p>
      </div>
    </div>

    <div class="tl-kpis" id="tl-kpis"></div>

    <div class="tl-panel">
      <header>
        <h2 id="tl-panel-h">Розбивка</h2>
        <p id="tl-panel-sub">—</p>
      </header>
      <div id="tl-body"></div>
    </div>
  </main>
</div>

<script>
/* ═══════════ СТОРІНКА ТІМЛІДА ═══════════

   ЩО ЦЕ. Окрема сторінка для тімліда: своя команда і її результати.
   Не режим дашборда, який ховає зайве класами — там увесь код і всі
   дані однаково приїжджали в браузер, і «закрито» означало лише «не
   намальовано». Тут не приходить нічого зайвого.

   ХТО ПУСКАЄ. Звичайний вхід у дашборд, далі рядок у team_members:
   він дає і роль (lead / admin), і команду. Ні ключів у посиланні, ні
   паролів: команду не можна підмінити параметром, бо її ніхто не
   передає — вона читається з того, хто ти є. Межі даних однаково
   ставить база (TEAM_ROLES.sql), а ця перевірка лише вирішує, чи
   показувати сторінку і чию команду на ній малювати.

   ВІДМОВА ЗАВЖДИ НАЗИВАЄ СЕБЕ. «Access denied» не каже, чого бракує:
   входу, рядка в команді чи ролі. Кожен із цих трьох випадків тут
   звучить по-своєму й каже, що робити далі.

   ЧИСЛА МУСЯТЬ ЗБІГАТИСЬ ІЗ ДАШБОРДОМ. Виручка рахується тією самою
   формулою (cpa: депозити × ставка; spend: відсоток від спенду) і так
   само розводить дублі ставок: та сама пара гео+офер двома рядками —
   перемагає активний. Інакше тімлід і власник дивились би на різні
   числа і зʼясовували б, хто з них має рацію. */

const SUPABASE_URL = 'https://zsfumuiajrytmeycbtnn.supabase.co';

/* Прапорець лише для дворівневого коду країни — те саме правило, що в
   дашборді: на «—» чи назву регіону flagcdn віддав би 404, і поруч із
   кодом висіла б бита іконка. */
const FLAG_ALIAS = { UK: 'gb', EL: 'gr' };
function flag(code) {
  const c = String(code || '').trim().toUpperCase();
  if (!/^[A-Z]{2}$/.test(c)) return '';
  return `<img src="https://flagcdn.com/w40/${FLAG_ALIAS[c] || c.toLowerCase()}.png"
    alt="" loading="lazy" onerror="this.remove()">`;
}

/* ─────────── ставки ─────────── */
function tlApplyPayouts(data) {
  tlPayouts = {}; tlModels = {};
  const fromActive = new Set();
  (data || []).forEach(p => {
    const key = String(p.geo || '').toUpperCase().trim() + '_'
              + String(p.offer || 'DEFAULT').toUpperCase().trim();
    const on = p.active !== false;
    if (!on && (fromActive.has(key) || tlPayouts[key] !== undefined)) return;
    if (on) fromActive.add(key);
    tlPayouts[key] = Number(p.value);
    tlModels[key] = (p.model === 'spend') ? 'spend' : 'cpa';
  });
}
function payoutOf(geo, offer) {
  const g = String(geo || '').toUpperCase().trim();
  const o = String(offer || 'DEFAULT').toUpperCase().trim();
  const key = tlPayouts[`${g}_${o}`] !== undefined ? `${g}_${o}` : `${g}_DEFAULT`;
  return { value: tlPayouts[key] || 0, model: tlModels[key] || 'cpa' };
}
function revenueOf(r) {
  const p = payoutOf(r.geo, r.offer);
  if (p.model === 'spend') return (Number(r.spend) || 0) * p.value / 100;
  return (Number(r.deposits ?? r.deps) || 0) * p.value;
}

/* ─────────── підсумки ─────────── */
function sum(rows) {
  const t = { s: 0, r: 0, d: 0, rev: 0, n: 0 };
  rows.forEach(x => {
    t.s += Number(x.spend) || 0;
    t.r += Number(x.regs) || 0;
    t.d += Number(x.deposits) || 0;
    t.rev += revenueOf(x);
    t.n++;
  });
  t.profit = t.rev - t.s;
  /* Спенду немає — ROI не «0%», а прочерк: нуль читався б як
     «відпрацювали в нуль», хоч насправді не крутили зовсім. */
  t.roi = t.s > 0 ? Math.round(t.profit / t.s * 100) : null;
  return t;
}
const roiTxt = t => t.roi === null ? '—' : t.roi + '%';
const toneCls = v => v >= 0 ? 'is-ok' : 'is-bad';
const monthsOf = rows => [...new Set(rows.map(r => String(r.date || '').slice(0, 7))
  .filter(m => /^\d{4}-\d{2}$/.test(m)))].sort().reverse();
const inMonth = r => !tlMonth || String(r.date || '').slice(0, 7) === tlMonth;

function groupBy(rows, keyOf, byKeyDesc) {
  const m = {};
  rows.forEach(r => { const k = keyOf(r); if (!k) return; (m[k] = m[k] || []).push(r); });
  const list = Object.entries(m).map(([k, v]) => ({ k, t: sum(v) }));
  list.sort(byKeyDesc ? (a, b) => b.k.localeCompare(a.k) : (a, b) => b.t.s - a.t.s);
  return list;
}

/* ─────────── рендер ─────────── */

    ['CPA', money(t.d > 0 ? t.s / t.d : 0), ''],
    ['CPL', money(t.r > 0 ? t.s / t.r : 0), '']
  ].map(([k, v, note, cls]) => `<div class="tl-kpi">
      <p>${k}</p><b class="${cls || ''}">${v}</b>

  const H = { today: 'Сьогодні', caps: 'Капи', tasks: 'Таски команді',

  if (tlSec === 'geo')   return tlTable('Гео', groupBy(rows, r => String(r.geo || '—').toUpperCase()),
    'Розбивка за вибраний місяць', true);
  return tlToday();
}

/* МОЯ КОМАНДА — СПИСОК ЛЮДЕЙ, А НЕ СПИСОК ТИХ, ХТО КРУТИВ.

   Йдемо від складу команди, а не від рядків статистики. Інакше людина,
   яка цього місяця нічого не запускала, просто зникала б зі списку — і
   «чому його тут немає» читалось би як поломка сторінки, хоч це
   відповідь на питання, якого ніхто не ставив.

   Рядок без created_by — це НЕ ще один баєр, а незаповнена колонка
   (SECURITY_BUYERS.sql, крок 3). Тому такі рядки йдуть окремо й
   підписані як є, а не домальовуються комусь. */
function tlTeamTable(rows) {
  document.getElementById('tl-panel-h').textContent = 'Люди';
  document.getElementById('tl-panel-sub').textContent =
    'Склад команди і результат кожного за ' + (tlMonth || 'весь час');
  const body = document.getElementById('tl-body');

  const byUid = {};
  rows.forEach(r => { const u = String(r.created_by || ''); (byUid[u] = byUid[u] || []).push(r); });

  const list = tlMembers.map(m => ({
    uid: String(m.user_id || ''),
    name: m.name || String(m.user_id || '').slice(0, 8),
    named: !!m.name,
    role: m.role || 'buyer',
    t: sum(byUid[String(m.user_id || '')] || [])
  })).sort((a, b) => b.t.s - a.t.s);

  const orphan = byUid[''] || [];
  const known = new Set(tlMembers.map(m => String(m.user_id || '')));
  const strangers = Object.keys(byUid).filter(u => u && !known.has(u))
    .map(u => ({ uid: u, name: u.slice(0, 8), named: false, role: '', t: sum(byUid[u]) }));

  if (!list.length && !strangers.length && !orphan.length) {
    body.innerHTML = '<p class="tl-empty">У team_members ще немає жодного рядка цієї команди</p>';
    return;
  }

  const row = p => `<tr class="${p.t.n ? '' : 'tl-idle'}">
    <td><span class="tl-name">${esc(p.name)}${p.role
      ? `<span class="tl-chip ${p.role === 'lead' || p.role === 'admin' ? 'is-lead' : ''}">${esc(p.role)}</span>`
      : '<span class="tl-chip">не в команді</span>'}</span></td>
    <td>${p.t.n ? money(p.t.s) : '—'}</td>
    <td>${p.t.n ? p.t.r : '—'}</td>
    <td>${p.t.n ? p.t.d : '—'}</td>
    <td class="tl-muted">${p.t.d > 0 ? money(p.t.s / p.t.d) : '—'}</td>
    <td class="${p.t.n ? toneCls(p.t.profit) : 'tl-muted'}">${p.t.n ? money(p.t.profit) : '—'}</td>
    <td class="${p.t.n ? (p.t.roi === null ? 'tl-muted' : toneCls(p.t.profit)) : 'tl-muted'}">${p.t.n ? roiTxt(p.t) : '—'}</td>
  </tr>`;

  const all = sum(rows);
  body.innerHTML = `<table class="tl-tbl">
    <thead><tr><th>Людина</th><th>Spend</th><th>Reg</th><th>Dep</th><th>CPA</th><th>Gross</th><th>ROI</th></tr></thead>
    <tbody>
      ${list.map(row).join('')}
      ${strangers.map(row).join('')}
      ${orphan.length ? `<tr class="tl-idle"><td colspan="7" style="text-align:left">
        ${orphan.length} ${orphan.length === 1 ? 'рядок' : 'рядків'} без автора —
        у них не заповнена колонка created_by, тож їх не можна віднести нікому
        (SECURITY_BUYERS.sql, крок 3)</td></tr>` : ''}
    </tbody>
    <tfoot><tr>
      <td>Разом</td><td>${money(all.s)}</td><td>${all.r}</td><td>${all.d}</td>
      <td class="tl-muted">${all.d > 0 ? money(all.s / all.d) : '—'}</td>
      <td class="${toneCls(all.profit)}">${money(all.profit)}</td>
      <td class="${all.roi === null ? 'tl-muted' : toneCls(all.profit)}">${roiTxt(all)}</td>
    </tr></tfoot>
  </table>`;
}

   встигнути попросити розширення; 100% — коли кожен наступний деп
   може не зарахуватись. */
function capState(c) {
  if (c.cap == null) return { k: 'none',  cls: '',        tag: 'капи не задано',  tagCls: '' };
  const p = c.cap > 0 ? c.got / c.cap * 100 : 0;
  if (p > 100) return { k: 'over',  cls: 'is-over',  tag: 'перелита',   tagCls: 'is-bad',  p };
  if (p >= 100) return { k: 'full', cls: 'is-full',  tag: 'повна',      tagCls: 'is-ok',   p };
  if (p >= 80) return { k: 'close', cls: 'is-close', tag: 'майже повна',tagCls: 'is-warn', p };
  if (p === 0) return { k: 'empty', cls: '',         tag: 'ще нічого',  tagCls: '',        p };
  return { k: 'fill', cls: '', tag: 'наповнюється', tagCls: '', p };
}

      <div><p>Майже повні</p><b class="${close ? 'is-bad' : ''}">${close}</b></div>
      <div><p>Перелиті</p><b class="${over ? 'is-bad' : ''}">${over}</b></div>
      <div><p>Без капи</p><b class="${noCap ? 'is-bad' : ''}">${noCap}</b></div>
    </div>
    <table class="tl-tbl">
      <thead><tr>
        <th>Гео</th><th style="text-align:left">Офер</th><th>Капа</th><th>Відлито</th>
        <th>Залишок</th><th>Прогрес</th><th>Темп до ночі</th><th style="text-align:right">Стан</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <!-- ЧАСОВИЙ ПОЯС — НЕ ДРІБНИЦЯ. Доба капи скидається опівночі в
         партнера, а не в нас. Якщо рахувати за своїм днем, то кожен
         вечір кілька годин ми дивимось на чужу добу й не можемо цього
         помітити: число виглядає нормальним. Тому пояс стоїть поруч із
         капою, а сторінка каже, за яку саме дату рахує. -->
    <div style="padding:12px 14px;border-top:1px solid var(--border)">
      <p class="tl-muted" style="margin:0;font-size:11px;line-height:1.6">
        Рахуємо за <b style="color:var(--text-main)">30.10</b> у поясі кожної капи.
        PL без пояса — там доба взята наша, і це видно окремо, щоб не плутати.
        Капи KZ ще не торкались: партнер дав 80, відлито нуль.
      </p>
    </div>`;
}

      <p style="margin:3px 0 0;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)">Сьогоднішній день, оновлюється з імпортів</p>
    </header>

function tlTable(label, list, sub, withFlag) {
  document.getElementById('tl-panel-h').textContent = label;
  document.getElementById('tl-panel-sub').textContent = sub;
  const body = document.getElementById('tl-body');
  if (!list.length) {
    body.innerHTML = `<p class="tl-empty">${tlRows.length
      ? 'За цей місяць рядків немає'
      : 'Жодного рядка статистики ще немає'}</p>`;
    return;
  }
  const tot = list.reduce((a, x) => {
    a.s += x.t.s; a.r += x.t.r; a.d += x.t.d; a.rev += x.t.rev; return a;
  }, { s: 0, r: 0, d: 0, rev: 0 });
  tot.profit = tot.rev - tot.s;
  tot.roi = tot.s > 0 ? Math.round(tot.profit / tot.s * 100) : null;

  body.innerHTML = `<table class="tl-tbl">
    <thead><tr>
      <th>${label}</th><th>Spend</th><th>Reg</th><th>Dep</th><th>CPA</th><th>Gross</th><th>ROI</th>
    </tr></thead>
    <tbody>${list.map(({ k, t }) => `<tr>
      <td><span class="tl-name">${withFlag ? flag(k) : ''}${esc(k)}</span></td>
      <td>${money(t.s)}</td><td>${t.r}</td><td>${t.d}</td>
      <td class="tl-muted">${t.d > 0 ? money(t.s / t.d) : '—'}</td>
      <td class="${toneCls(t.profit)}">${money(t.profit)}</td>
      <td class="${t.roi === null ? 'tl-muted' : toneCls(t.profit)}">${roiTxt(t)}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr>
      <td>Разом</td><td>${money(tot.s)}</td><td>${tot.r}</td><td>${tot.d}</td>
      <td class="tl-muted">${tot.d > 0 ? money(tot.s / tot.d) : '—'}</td>
      <td class="${toneCls(tot.profit)}">${money(tot.profit)}</td>
      <td class="${tot.roi === null ? 'tl-muted' : toneCls(tot.profit)}">${tot.roi === null ? '—' : tot.roi + '%'}</td>
    </tr></tfoot>
  </table>`;
}

/* ─────────── старт ─────────── */
const LOGIN = '<a href="index.html" style="color:var(--accent)">Відкрий дашборд</a>';

async function tlBoot() {
  let uid = null;
  try { uid = (await sb.auth.getSession()).data.session?.user?.id || null; } catch (e) {}
  if (!uid) {
    gate('Спершу увійди', LOGIN + ' і зайди під своїм акаунтом, потім повернись сюди. '
      + 'Ця сторінка не має власного входу — вона користується тим самим.');
    return;
  }

  /* Команду НЕ передають параметром — її читають із того, хто ти є.
     Саме тому тут немає ?team=: підмінити команду в посиланні
     неможливо, якщо її ніхто не приймає ззовні. */
  let me = null, mErr = '';
  try {
    const { data, error } = await sb.from('team_members')
      .select('user_id,team_name,name,role').eq('user_id', uid).limit(1);
    if (error) throw error;
    me = (data || [])[0] || null;
  } catch (e) { mErr = e.message || e.code || String(e); }

  if (mErr) {
    gate('Не вдалось прочитати команду', 'Запит до <code>team_members</code> відмовив: <b>'
      + esc(mErr) + '</b><br><br>Найчастіше це означає, що TEAM_ROLES.sql ще не виконували.');
    return;
  }
  if (!me) {
    gate('Тебе ще немає в команді', 'Твого рядка немає в <code>team_members</code>, '
      + 'тож ні команди, ні ролі в тебе поки що немає. Власник додає людей через TEAM_ROLES.sql.');
    return;
  }
  const role = me.role || 'buyer';
  if (role !== 'lead' && role !== 'admin') {
    gate('Ця сторінка для тімліда', 'Твоя роль — <b>' + esc(role) + '</b>. '
      + 'Командні числа видно тімліду й власнику; ' + LOGIN + ' для своєї роботи.');
    return;
  }

  tlMe = me;
  tlTeam = me.team_name || '';
  if (!tlTeam) {
    gate('У рядку немає команди', 'Роль <b>' + esc(role) + '</b> є, а <code>team_name</code> порожній — '
      + 'тому невідомо, чию команду показувати.');
    return;
  }
  document.getElementById('tl-team').textContent = tlTeam;
  const myName = me.name || String(uid).slice(0, 8);
  document.getElementById('tl-me-name').textContent = myName;
  document.getElementById('tl-me-role').textContent = role;
  document.getElementById('tl-ava').textContent = (myName[0] || '?').toUpperCase();

  const [stats, pays, members] = await Promise.all([
    sb.from('daily_stats').select('*').eq('team_name', tlTeam).order('date', { ascending: false }),
    sb.from('payouts').select('*').eq('team_name', tlTeam),
    sb.from('team_members').select('user_id,name,role').eq('team_name', tlTeam)
  ]);

  if (stats.error) {
    gate('База не віддала статистику', 'Запит до <code>daily_stats</code> відмовив: <b>'
      + esc(stats.error.message || stats.error.code || 'невідома помилка')
      + '</b><br><br>Політики доступу не пускають читати цю команду.');
    return;
  }

  tlRows = stats.data || [];
  tlMembers = members?.data || [];
  tlApplyPayouts(pays?.data);

  const ms = monthsOf(tlRows);
  const sel = document.getElementById('tl-month');
  sel.innerHTML = '<option value="">Весь час</option>'
    + ms.map(m => `<option value="${m}">${m}</option>`).join('');
  tlMonth = ms[0] || '';
  sel.value = tlMonth;
  sel.onchange = () => { tlMonth = sel.value; tlRender(); };

  document.querySelectorAll('.tl-nav').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.tl-nav').forEach(x => x.classList.toggle('is-on', x === b));
      tlSec = b.getAttribute('data-sec');
      tlRender();
    };
  });

  document.getElementById('tl-gate').style.display = 'none';
  document.getElementById('tl-app').style.display = 'flex';
  tlRender();
}

tlBoot().catch(e => gate('Сторінка не піднялась', esc(e.message || e)));
</script>
